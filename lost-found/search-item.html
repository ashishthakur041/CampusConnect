<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Items - CampusConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand fw-bold"
               href="../user/dashboard.html">
                🎓 CampusConnect
            </a>

            <a href="../user/dashboard.html"
               class="btn btn-light btn-sm">

                <i class="fa-solid fa-house"></i>
                Dashboard

            </a>

        </div>
    </nav>


    <!-- Main -->
    <div class="container py-5">

        <div class="text-center mb-4">

            <h2 class="fw-bold">
                Search Lost & Found Items
            </h2>

            <p class="text-muted">
                Find an item reported on campus.
            </p>

        </div>


        <!-- Search Box -->
        <div class="card border-0 shadow-sm p-4 mb-4">

            <div class="row g-3">

                <div class="col-md-5">

                    <label class="form-label fw-semibold">
                        Search Item
                    </label>

                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Search by item name...">

                </div>


                <div class="col-md-3">

                    <label class="form-label fw-semibold">
                        Category
                    </label>

                    <select id="categoryFilter"
                            class="form-select">

                        <option value="">
                            All Categories
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Documents">
                            Documents
                        </option>

                        <option value="Books">
                            Books
                        </option>

                        <option value="Clothing">
                            Clothing
                        </option>

                        <option value="Accessories">
                            Accessories
                        </option>

                        <option value="Stationery">
                            Stationery
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="col-md-3">

                    <label class="form-label fw-semibold">
                        Status
                    </label>

                    <select id="statusFilter"
                            class="form-select">

                        <option value="">
                            All Status
                        </option>

                        <option value="Lost">
                            Lost
                        </option>

                        <option value="Found">
                            Found
                        </option>

                    </select>

                </div>


                <div class="col-md-1 d-flex align-items-end">

                    <button
                        class="btn btn-primary w-100"
                        onclick="searchItems()">

                        <i class="fa-solid fa-search"></i>

                    </button>

                </div>

            </div>

        </div>


        <!-- Result Count -->
        <div class="mb-3">

            <h5>
                Results:
                <span id="resultCount"
                      class="badge bg-primary">
                    0
                </span>
            </h5>

        </div>


        <!-- Items -->
        <div class="row g-4"
             id="itemsContainer">

        </div>

    </div>


    <script>

        // ==========================================
        // CHECK LOGIN
        // ==========================================

        const currentUser =
            JSON.parse(
                localStorage.getItem("campusCurrentUser")
            );


        if (!currentUser || currentUser.role !== "user") {

            window.location.href = "../login.html";

        }


        // ==========================================
        // GET ITEMS
        // ==========================================

        const lostItems =
            JSON.parse(
                localStorage.getItem("lostItems")
            ) || [];


        // ==========================================
        // SEARCH INPUT EVENTS
        // ==========================================

        document
            .getElementById("searchInput")
            .addEventListener("input", searchItems);


        document
            .getElementById("categoryFilter")
            .addEventListener("change", searchItems);


        document
            .getElementById("statusFilter")
            .addEventListener("change", searchItems);


        // ==========================================
        // SEARCH FUNCTION
        // ==========================================

        function searchItems() {

            const search =
                document
                .getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();


            const category =
                document
                .getElementById("categoryFilter")
                .value;


            const status =
                document
                .getElementById("statusFilter")
                .value;


            const filteredItems =
                lostItems.filter(function(item) {

                    const matchesSearch =
                        item.itemName
                        .toLowerCase()
                        .includes(search);


                    const matchesCategory =
                        category === "" ||
                        item.category === category;


                    const matchesStatus =
                        status === "" ||
                        item.status === status;


                    return (
                        matchesSearch &&
                        matchesCategory &&
                        matchesStatus
                    );

                });


            displayItems(filteredItems);

        }


        // ==========================================
        // DISPLAY ITEMS
        // ==========================================

        function displayItems(items) {

            const container =
                document.getElementById("itemsContainer");


            const resultCount =
                document.getElementById("resultCount");


            resultCount.textContent =
                items.length;


            container.innerHTML = "";


            if (items.length === 0) {

                container.innerHTML = `

                    <div class="col-12">

                        <div class="card border-0 shadow-sm p-5
                                    text-center">

                            <i class="fa-solid fa-box-open
                                      fa-3x text-muted mb-3"></i>

                            <h5>
                                No items found
                            </h5>

                            <p class="text-muted">
                                Try a different search or filter.
                            </p>

                        </div>

                    </div>

                `;

                return;

            }


            items
                .slice()
                .reverse()
                .forEach(function(item) {

                    let imageHTML = "";


                    if (item.image) {

                        imageHTML = `

                            <img
                                src="${item.image}"
                                class="card-img-top"
                                style="height:200px;
                                       object-fit:cover;"
                                alt="Lost Item">

                        `;

                    } else {

                        imageHTML = `

                            <div
                                class="d-flex align-items-center
                                       justify-content-center
                                       bg-light"
                                style="height:200px;">

                                <i class="fa-solid fa-image
                                          fa-4x text-muted"></i>

                            </div>

                        `;

                    }


                    const statusClass =
                        item.status === "Found"
                        ? "success"
                        : "warning";


                    let actionButton = "";


                    if (item.status === "Lost") {

                        actionButton = `

                            <button
                                class="btn btn-success w-100"
                                onclick="claimItem(${item.id})">

                                <i class="fa-solid
                                          fa-hand-holding-heart"></i>

                                Claim Item

                            </button>

                        `;

                    } else {

                        actionButton = `

                            <button
                                class="btn btn-secondary w-100"
                                disabled>

                                <i class="fa-solid fa-check"></i>

                                Already Found

                            </button>

                        `;

                    }


                    container.innerHTML += `

                        <div class="col-md-6 col-lg-4">

                            <div class="card border-0 shadow-sm
                                        h-100">

                                ${imageHTML}

                                <div class="card-body">

                                    <div class="d-flex
                                                justify-content-between
                                                align-items-start">

                                        <h5 class="fw-bold">
                                            ${escapeHTML(
                                                item.itemName
                                            )}
                                        </h5>

                                        <span class="badge
                                                     text-bg-${statusClass}">

                                            ${escapeHTML(
                                                item.status
                                            )}

                                        </span>

                                    </div>


                                    <p class="mb-2">

                                        <i class="fa-solid
                                                  fa-tag text-primary">
                                        </i>

                                        ${escapeHTML(
                                            item.category
                                        )}

                                    </p>


                                    <p class="mb-2">

                                        <i class="fa-solid
                                                  fa-location-dot
                                                  text-primary">
                                        </i>

                                        ${escapeHTML(
                                            item.location
                                        )}

                                    </p>


                                    <p class="mb-2">

                                        <i class="fa-solid
                                                  fa-calendar
                                                  text-primary">
                                        </i>

                                        ${formatDate(
                                            item.lostDate
                                        )}

                                    </p>


                                    <p class="text-muted small">

                                        ${escapeHTML(
                                            item.description
                                        )}

                                    </p>


                                    <hr>

                                    ${actionButton}

                                </div>

                            </div>

                        </div>

                    `;

                });

        }


        // ==========================================
        // CLAIM ITEM
        // ==========================================

        function claimItem(id) {

            const item =
                lostItems.find(function(item) {

                    return item.id === id;

                });


            if (!item) {
                return;
            }


            if (item.reportedBy === currentUser.email) {

                alert(
                    "You cannot claim your own reported item."
                );

                return;

            }


            let claims =
                JSON.parse(
                    localStorage.getItem("claims")
                ) || [];


            const existingClaim =
                claims.find(function(claim) {

                    return (
                        claim.itemId === id &&
                        claim.claimedBy === currentUser.email &&
                        claim.status === "Pending"
                    );

                });


            if (existingClaim) {

                alert(
                    "You have already submitted a claim for this item."
                );

                return;

            }


            const newClaim = {

                id: Date.now(),

                itemId: id,

                itemName: item.itemName,

                claimedBy: currentUser.email,

                claimedByName: currentUser.name,

                claimDate:
                    new Date().toISOString(),

                status: "Pending"

            };


            claims.push(newClaim);


            localStorage.setItem(
                "claims",
                JSON.stringify(claims)
            );


            alert(
                "Claim submitted successfully!"
            );


            searchItems();

        }


        // ==========================================
        // DATE FORMAT
        // ==========================================

        function formatDate(date) {

            if (!date) {
                return "-";
            }

            return new Date(date)
                .toLocaleDateString("en-IN");

        }


        // ==========================================
        // HTML ESCAPE
        // ==========================================

        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // ==========================================
        // INITIAL DISPLAY
        // ==========================================

        searchItems();

    </script>

</body>

</html>
