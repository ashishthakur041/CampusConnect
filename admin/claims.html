<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Claims - CampusConnect</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="dashboard.html">
            🎓 CampusConnect
        </a>

        <button class="btn btn-light btn-sm" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </button>

    </div>
</nav>


<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold">
                <i class="fa-solid fa-hand-holding-heart text-primary"></i>
                Manage Claims
            </h2>

            <p class="text-muted mb-0">
                Review claims submitted by users.
            </p>
        </div>

        <a href="dashboard.html" class="btn btn-outline-primary">
            <i class="fa-solid fa-arrow-left"></i>
            Dashboard
        </a>

    </div>


    <!-- Claims -->

    <div class="card border-0 shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">

                        <tr>
                            <th>#</th>
                            <th>Item</th>
                            <th>Claimed By</th>
                            <th>Claim Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="claimTable"></tbody>

                </table>

            </div>


            <div id="noClaims"
                 class="text-center text-muted py-4 d-none">

                <i class="fa-solid fa-hand-holding-heart fa-2x mb-2"></i>

                <p class="mb-0">
                    No claims submitted yet.
                </p>

            </div>

        </div>

    </div>

</div>


<script>

    // Check admin login
    const currentUser =
        JSON.parse(localStorage.getItem("campusCurrentUser"));

    if (!currentUser || currentUser.role !== "admin") {

        window.location.href = "../login.html";

    }


    // Load claims
    function loadClaims() {

        const claims =
            JSON.parse(localStorage.getItem("claims")) || [];

        const table =
            document.getElementById("claimTable");

        const noClaims =
            document.getElementById("noClaims");


        if (claims.length === 0) {

            table.innerHTML = "";

            noClaims.classList.remove("d-none");

            return;
        }


        noClaims.classList.add("d-none");


        claims.sort(
            (a, b) =>
                new Date(b.claimDate) -
                new Date(a.claimDate)
        );


        table.innerHTML = claims.map((claim, index) => `

            <tr>

                <td>
                    ${index + 1}
                </td>

                <td>
                    <strong>
                        ${escapeHTML(claim.itemName)}
                    </strong>
                </td>

                <td>
                    ${escapeHTML(
                        claim.claimedByName ||
                        claim.claimedBy
                    )}
                    <br>

                    <small class="text-muted">
                        ${escapeHTML(claim.claimedBy)}
                    </small>
                </td>

                <td>
                    ${formatDate(claim.claimDate)}
                </td>

                <td>
                    ${getStatusBadge(claim.status)}
                </td>

                <td>

                    ${
                        claim.status === "Pending"
                        ? `
                            <button
                                class="btn btn-sm btn-success me-1"
                                onclick="updateClaim(${claim.id}, 'Approved')">

                                <i class="fa-solid fa-check"></i>
                                Approve

                            </button>

                            <button
                                class="btn btn-sm btn-danger"
                                onclick="updateClaim(${claim.id}, 'Rejected')">

                                <i class="fa-solid fa-xmark"></i>
                                Reject

                            </button>
                          `
                        : `
                            <span class="text-muted">
                                No action
                            </span>
                          `
                    }

                </td>

            </tr>

        `).join("");
    }


 // Update claim status
function updateClaim(id, status) {

    const message =
        status === "Approved"
            ? "Approve this claim?"
            : "Reject this claim?";

    if (!confirm(message)) {
        return;
    }

    let claims =
        JSON.parse(localStorage.getItem("claims")) || [];

    let lostItems =
        JSON.parse(localStorage.getItem("lostItems")) || [];


    // Find the selected claim
    const selectedClaim =
        claims.find(claim => claim.id === id);


    if (!selectedClaim) {

        alert("Claim not found!");

        return;
    }


    // Update claim
    claims = claims.map(claim => {

        if (claim.id === id) {

            return {
                ...claim,
                status: status,
                approvedDate:
                    status === "Approved"
                        ? new Date().toISOString()
                        : claim.approvedDate || null
            };

        }

        return claim;

    });


    // If claim is approved
    if (status === "Approved") {

        lostItems = lostItems.map(item => {

            if (item.id === selectedClaim.itemId) {

                return {
                    ...item,

                    // Item has been found
                    status: "Found",

                    // Store finder/claim information
                    foundBy: selectedClaim.claimedBy,
                    foundByName:
                        selectedClaim.claimedByName ||
                        selectedClaim.claimedBy,

                    claimStatus: "Approved",

                    foundDate:
                        new Date().toISOString()
                };

            }

            return item;

        });


        // Save updated lost items
        localStorage.setItem(
            "lostItems",
            JSON.stringify(lostItems)
        );

    }


    // Save updated claims
    localStorage.setItem(
        "claims",
        JSON.stringify(claims)
    );


    loadClaims();


    if (status === "Approved") {

        alert(
            "Claim approved! The item is now marked as Found."
        );

    } else {

        alert(
            "Claim rejected successfully!"
        );

    }

}


    // Status badge
    function getStatusBadge(status) {

        if (status === "Approved") {

            return `
                <span class="badge bg-success">
                    Approved
                </span>
            `;

        }


        if (status === "Rejected") {

            return `
                <span class="badge bg-danger">
                    Rejected
                </span>
            `;

        }


        return `
            <span class="badge bg-warning text-dark">
                Pending
            </span>
        `;
    }


    // Escape HTML
    function escapeHTML(text) {

        const div = document.createElement("div");

        div.textContent = text || "";

        return div.innerHTML;
    }


    // Format date
    function formatDate(date) {

        if (!date) {
            return "N/A";
        }

        return new Date(date).toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );
    }


    // Logout
    function logout() {

        localStorage.removeItem("campusCurrentUser");

        window.location.href = "../login.html";
    }


    loadClaims();

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
