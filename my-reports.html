<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Reports - CampusConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand fw-bold" href="../user/dashboard.html">
                🎓 CampusConnect
            </a>

            <a href="../user/dashboard.html"
               class="btn btn-light btn-sm">

                <i class="fa-solid fa-house"></i>
                Dashboard

            </a>

        </div>
    </nav>


    <!-- Main -->
    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold mb-1">
                    My Reports
                </h2>

                <p class="text-muted mb-0">
                    Items reported by you.
                </p>

            </div>

            <a href="report-item.html"
               class="btn btn-primary">

                <i class="fa-solid fa-plus"></i>
                Report Item

            </a>

        </div>


        <!-- Reports -->
        <div class="card border-0 shadow-sm">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-light">

                            <tr>
                                <th>Image</th>
                                <th>Item</th>
                                <th>Category</th>
                                <th>Location</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>

                        </thead>

                        <tbody id="reportsTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <script>

        // ==========================================
        // CHECK LOGIN
        // ==========================================

        const currentUser =
            JSON.parse(
                localStorage.getItem("campusCurrentUser")
            );


        if (!currentUser || currentUser.role !== "user") {

            window.location.href = "../login.html";

        }


        // ==========================================
        // GET ITEMS
        // ==========================================

        let lostItems =
            JSON.parse(
                localStorage.getItem("lostItems")
            ) || [];


        const reportsTable =
            document.getElementById("reportsTable");


        // ==========================================
        // MY REPORTS
        // ==========================================

        const myReports =
            lostItems.filter(function(item) {

                return item.reportedBy === currentUser.email;

            });


        // ==========================================
        // NO REPORTS
        // ==========================================

        if (myReports.length === 0) {

            reportsTable.innerHTML = `

                <tr>

                    <td colspan="7"
                        class="text-center text-muted py-5">

                        <i class="fa-solid fa-box-open fa-2x mb-3"></i>

                        <br>

                        You have not reported any items yet.

                    </td>

                </tr>

            `;

        }


        // ==========================================
        // DISPLAY REPORTS
        // ==========================================

        myReports.reverse().forEach(function(item) {

            let imageHTML = "";

            if (item.image) {

                imageHTML = `

                    <img
                        src="${item.image}"
                        alt="Item"
                        width="60"
                        height="60"
                        style="object-fit: cover;
                               border-radius: 8px;">

                `;

            } else {

                imageHTML = `

                    <div
                        class="bg-light d-flex
                               align-items-center
                               justify-content-center"
                        style="width:60px;
                               height:60px;
                               border-radius:8px;">

                        <i class="fa-solid fa-image text-muted"></i>

                    </div>

                `;

            }


            const statusClass =
                item.status === "Found"
                ? "success"
                : "warning";


            reportsTable.innerHTML += `

                <tr>

                    <td>
                        ${imageHTML}
                    </td>

                    <td>
                        <strong>
                            ${escapeHTML(item.itemName)}
                        </strong>
                    </td>

                    <td>
                        ${escapeHTML(item.category)}
                    </td>

                    <td>
                        ${escapeHTML(item.location)}
                    </td>

                    <td>
                        ${formatDate(item.lostDate)}
                    </td>

                    <td>

                        <span class="badge text-bg-${statusClass}">
                            ${escapeHTML(item.status)}
                        </span>

                    </td>

                    <td>

                        <button
                            class="btn btn-danger btn-sm"
                            onclick="deleteReport(${item.id})">

                            <i class="fa-solid fa-trash"></i>

                        </button>

                    </td>

                </tr>

            `;

        });


        // ==========================================
        // DELETE REPORT
        // ==========================================

        function deleteReport(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this report?"
                );


            if (!confirmDelete) {
                return;
            }


            lostItems =
                lostItems.filter(function(item) {

                    return item.id !== id;

                });


            localStorage.setItem(
                "lostItems",
                JSON.stringify(lostItems)
            );


            location.reload();

        }


        // ==========================================
        // FORMAT DATE
        // ==========================================

        function formatDate(date) {

            if (!date) {
                return "-";
            }

            const d = new Date(date);

            return d.toLocaleDateString("en-IN");

        }


        // ==========================================
        // BASIC HTML ESCAPE
        // ==========================================

        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }

    </script>

</body>

</html>
