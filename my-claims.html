<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Claims - CampusConnect</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="../user/dashboard.html">
            🎓 CampusConnect
        </a>

        <button class="btn btn-light btn-sm" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </button>

    </div>
</nav>


<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold">
                <i class="fa-solid fa-hand-holding-heart text-primary"></i>
                My Claims
            </h2>

            <p class="text-muted mb-0">
                Track the status of items you have claimed.
            </p>
        </div>

        <a href="../user/dashboard.html"
           class="btn btn-outline-primary">

            <i class="fa-solid fa-arrow-left"></i>
            Dashboard

        </a>

    </div>


    <!-- Claims Container -->

    <div id="claimsContainer"></div>


    <!-- No Claims -->

    <div id="noClaims"
         class="text-center text-muted py-5 d-none">

        <i class="fa-solid fa-hand-holding-heart fa-3x mb-3"></i>

        <h5>No claims yet</h5>

        <p>
            You have not submitted any item claims.
        </p>

        <a href="search-item.html"
           class="btn btn-primary">

            <i class="fa-solid fa-magnifying-glass"></i>
            Search Items

        </a>

    </div>

</div>


<script>

    // Check login
    const currentUser =
        JSON.parse(localStorage.getItem("campusCurrentUser"));

    if (!currentUser || currentUser.role !== "user") {

        window.location.href = "../login.html";

    }


    // Load user's claims
    function loadClaims() {

        const allClaims =
            JSON.parse(localStorage.getItem("claims")) || [];


        const myClaims =
            allClaims.filter(
                claim =>
                    claim.claimedBy === currentUser.email
            );


        const container =
            document.getElementById("claimsContainer");

        const noClaims =
            document.getElementById("noClaims");


        if (myClaims.length === 0) {

            container.innerHTML = "";

            noClaims.classList.remove("d-none");

            return;
        }


        noClaims.classList.add("d-none");


        myClaims.sort(
            (a, b) =>
                new Date(b.claimDate) -
                new Date(a.claimDate)
        );


        container.innerHTML = myClaims.map(claim => `

            <div class="card border-0 shadow-sm mb-3">

                <div class="card-body p-4">

                    <div class="d-flex justify-content-between
                                align-items-center">

                        <div>

                            <h5 class="fw-bold mb-2">

                                <i class="fa-solid fa-box-open
                                          text-primary"></i>

                                ${escapeHTML(claim.itemName)}

                            </h5>

                            <p class="text-muted mb-1">

                                <i class="fa-regular fa-calendar"></i>

                                Claimed on:
                                ${formatDate(claim.claimDate)}

                            </p>

                        </div>


                        <div>

                            ${getStatusBadge(claim.status)}

                        </div>

                    </div>

                </div>

            </div>

        `).join("");
    }


    // Status badge
    function getStatusBadge(status) {

        if (status === "Approved") {

            return `
                <span class="badge bg-success fs-6">
                    <i class="fa-solid fa-check"></i>
                    Approved
                </span>
            `;

        }


        if (status === "Rejected") {

            return `
                <span class="badge bg-danger fs-6">
                    <i class="fa-solid fa-xmark"></i>
                    Rejected
                </span>
            `;

        }


        return `
            <span class="badge bg-warning text-dark fs-6">
                <i class="fa-solid fa-clock"></i>
                Pending
            </span>
        `;
    }


    // Escape HTML
    function escapeHTML(text) {

        const div = document.createElement("div");

        div.textContent = text || "";

        return div.innerHTML;
    }


    // Format date
    function formatDate(date) {

        if (!date) {
            return "N/A";
        }

        return new Date(date).toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );
    }


    // Logout
    function logout() {

        localStorage.removeItem("campusCurrentUser");

        window.location.href = "../login.html";
    }


    loadClaims();

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
